name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Starter chunks must stay byte-identical subsets of their parent banks;
      # a parent edit without regenerating starters must never deploy.
      - name: Verify starter chunks match their parent banks
        run: node scripts/verify-starter-chunks.mjs

      # Every Class 1 English/EVS answer is re-derived from independent truth
      # tables; a wrong answer or a missing language must never deploy.
      - name: Verify Class 1 questions
        run: node scripts/verify-class1-depth.mjs

      # About/Impact numbers are counted from content/ on every deploy, so the
      # page can never claim more (or less) than the banks actually hold.
      - name: Refresh About page impact numbers
        run: node scripts/generate-impact-stats.mjs

      - name: Assemble deploy folder
        run: |
          mkdir -p deploy
          cp urban/frontend/index.html deploy/
          cp urban/frontend/admin.html deploy/
          cp urban/frontend/privacy.html deploy/
          cp urban/frontend/terms.html deploy/
          cp urban/frontend/cbse-practice-questions.html deploy/
          cp urban/frontend/learn-in-hindi.html deploy/
          cp urban/frontend/learn-in-tamil.html deploy/
          cp urban/frontend/learn-in-telugu.html deploy/
          cp urban/frontend/learn-in-bengali.html deploy/
          cp urban/frontend/learn-in-marathi.html deploy/
          cp urban/frontend/about.html deploy/
          cp urban/frontend/for-teachers.html deploy/
          cp urban/frontend/stats.html deploy/
          cp urban/frontend/world.html deploy/
          cp urban/frontend/sw.js deploy/
          cp urban/frontend/online-learning-games-india.html deploy/
          cp urban/frontend/favicon.svg deploy/
          cp urban/frontend/og-image.png deploy/
          cp urban/frontend/icon-192.png deploy/
          cp urban/frontend/icon-512.png deploy/
          cp urban/frontend/icon-512-maskable.png deploy/
          cp urban/frontend/apple-touch-icon.png deploy/
          cp urban/frontend/offline.html deploy/
          cp urban/frontend/screenshot-home-narrow.png deploy/
          cp urban/frontend/screenshot-practice-narrow.png deploy/
          cp urban/frontend/screenshot-home-wide.png deploy/
          mkdir -p deploy/.well-known
          cp urban/frontend/.well-known/assetlinks.json deploy/.well-known/
          cp urban/frontend/manifest.json deploy/
          cp urban/frontend/robots.txt deploy/
          cp urban/frontend/sitemap.xml deploy/
          cp -r urban/frontend/css deploy/
          cp -r urban/frontend/js deploy/
          cp -r urban/frontend/practice deploy/
          cp -r urban/frontend/fonts deploy/
          cp -r content deploy/
          cp -r shared-lib deploy/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          cname: educerelator.com
