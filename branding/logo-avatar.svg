<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5e7e"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="capg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a68"/>
      <stop offset="1" stop-color="#2a1d4d"/>
    </linearGradient>
  </defs>

  <!-- rounded-square gradient tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- soft glow behind the owl -->
  <circle cx="512" cy="560" r="330" fill="#ffffff" opacity="0.10"/>

  <!-- ear tufts -->
  <path d="M 330 380 Q 318 268 396 300 Q 372 348 398 396 Z" fill="#ffffff"/>
  <path d="M 694 380 Q 706 268 628 300 Q 652 348 626 396 Z" fill="#ffffff"/>

  <!-- body -->
  <path d="M 512 302 C 680 302 762 424 762 584 C 762 748 650 838 512 838 C 374 838 262 748 262 584 C 262 424 344 302 512 302 Z" fill="#ffffff"/>

  <!-- wings -->
  <path d="M 276 560 Q 236 660 300 748 Q 330 700 330 620 Q 330 580 276 560 Z" fill="#f3e8ff" opacity="0.9"/>
  <path d="M 748 560 Q 788 660 724 748 Q 694 700 694 620 Q 694 580 748 560 Z" fill="#f3e8ff" opacity="0.9"/>

  <!-- belly feather arcs -->
  <path d="M 400 720 q 112 66 224 0" stroke="#e9d5ff" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M 428 782 q 84 48 168 0" stroke="#e9d5ff" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="418" cy="536" r="104" fill="#f5f3ff"/>
  <circle cx="606" cy="536" r="104" fill="#f5f3ff"/>
  <circle cx="418" cy="536" r="98" fill="none" stroke="#7c3aed" stroke-width="10" opacity="0.35"/>
  <circle cx="606" cy="536" r="98" fill="none" stroke="#7c3aed" stroke-width="10" opacity="0.35"/>
  <circle cx="430" cy="548" r="52" fill="#3b2a68"/>
  <circle cx="594" cy="548" r="52" fill="#3b2a68"/>
  <circle cx="448" cy="530" r="16" fill="#ffffff"/>
  <circle cx="612" cy="530" r="16" fill="#ffffff"/>

  <!-- beak -->
  <path d="M 512 596 L 552 652 Q 512 692 472 652 Z" fill="#fbbf24"/>

  <!-- feet -->
  <ellipse cx="452" cy="842" rx="40" ry="18" fill="#fbbf24"/>
  <ellipse cx="572" cy="842" rx="40" ry="18" fill="#fbbf24"/>

  <!-- graduation cap -->
  <path d="M 512 172 L 776 268 L 512 364 L 248 268 Z" fill="url(#capg)"/>
  <path d="M 418 330 L 418 402 Q 512 448 606 402 L 606 330 L 512 364 Z" fill="#2a1d4d"/>
  <!-- tassel -->
  <path d="M 748 278 L 748 388" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>
  <circle cx="748" cy="404" r="22" fill="#fbbf24"/>
</svg>
