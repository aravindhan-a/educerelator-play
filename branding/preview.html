<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Educerelator brand preview</title>
<style>body{font-family:system-ui;background:#f4f4f8;margin:0;padding:24px}h2{margin:18px 0 8px;font-size:15px;color:#444}
.row{display:flex;align-items:flex-end;gap:24px}img{display:block}
.chip{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}</style></head>
<body>
<h2>Avatar — 512 / 96 / 48 px (profile-picture sizes)</h2>
<div class="row">
  <div class="chip"><img src="logo-avatar.svg" width="512" height="512"></div>
  <div class="chip"><img src="logo-avatar.svg" width="96" height="96"></div>
  <div class="chip"><img src="logo-avatar.svg" width="48" height="48"></div>
</div>
<h2>Wordmark (light backgrounds)</h2>
<div class="chip" style="max-width:840px"><img src="logo-wordmark.svg" width="800"></div>
<h2>Social banner — 1500×500 (X/Twitter, LinkedIn-ish)</h2>
<div class="chip" style="max-width:1040px"><img src="banner-social.svg" width="1000"></div>
</body></html>
